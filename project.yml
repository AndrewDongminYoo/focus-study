name: FocusStudy
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FocusStudy:
    type: application
    platform: iOS
    sources: [App, Shared, Integration]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.focusstudy.local
        INFOPLIST_FILE: Configuration/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/App.entitlements
    dependencies:
      - target: FocusMonitor
        embed: true
      - target: FocusReport
        embed: true
  FocusMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared, Integration]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.focusstudy.local.monitor
        INFOPLIST_FILE: Configuration/Monitor-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Monitor.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  FocusReport:
    type: app-extension
    platform: iOS
    sources: [Report]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.focusstudy.local.report
        INFOPLIST_FILE: Configuration/Report-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Report.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  FocusSDKTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SDKTests, Shared, Integration, App/SelectionRepository.swift, App/SessionRecord.swift, App/FocusModel.swift, App/AuthorizationService.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.focusstudy.local.sdktests
        GENERATE_INFOPLIST_FILE: YES
  FocusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FocusStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.focusstudy.local.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FocusStudy:
    build:
      targets:
        FocusStudy: all
    test:
      targets: [FocusSDKTests, FocusUITests]
