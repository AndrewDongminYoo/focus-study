name: FocusStudy
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 393JTTV68D
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The paid-access gate (docs/specs/2026-11-24-paid-access-design.md): both the app and the App Intents extension read these through their Info.plist.
    # The first paid build is a placeholder above 1.0.0's build 2; issue #255 sets the shipped value and turns the gate on for the paid build.
    PAID_UNLOCK_FIRST_BUILD: "3"
  configs:
    # Debug turns the gate on for simulator builds only: a signed Debug build on a device uses the sandbox, whose originalAppVersion "1.0" locks every start until the App Store Connect products of #254 exist.
    Debug:
      PAID_UNLOCK_ENABLED: "NO"
      "PAID_UNLOCK_ENABLED[sdk=iphonesimulator*]": "YES"
    Release:
      PAID_UNLOCK_ENABLED: "NO"
targets:
  FocusStudy:
    type: application
    platform: iOS
    sources:
      [
        App,
        Shared,
        Integration,
        Presentation,
        Activity,
        Widget/EverydayPlanWidgetView.swift,
        Widget/TodayWidgetView.swift,
      ]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy
        INFOPLIST_FILE: Configuration/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/App.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: FocusActivity
        embed: true
      - target: FocusMonitor
        embed: true
      - target: FocusReport
        embed: true
      - target: FocusStudyIntents
        embed: true
      - target: FocusShield
        embed: true
      - target: FocusShieldAction
        embed: true
  FocusMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Monitor
      # The Monitor never reads paid access (docs/specs/2026-11-24-paid-access-design.md) or the weekly review (docs/specs/2026-11-25-weekly-review-design.md).
      - path: Shared
        excludes: [PaidAccess.swift, WeeklyReview.swift]
      - Integration
      - path: Activity
        excludes: [FocusActivityViews.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy.monitor
        INFOPLIST_FILE: Configuration/Monitor-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Monitor.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
  # The Device Activity Report extension point accepts only an ExtensionKit extension: App Store Connect rejected the NSExtension build with error 91179 on 2026-11-22.
  FocusReport:
    type: extensionkit-extension
    platform: iOS
    sources: [Report, Presentation]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy.report
        INFOPLIST_FILE: Configuration/Report-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Report.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
  # The App Intents extension that runs the Focus filter while the app is not running (2026-11-16 extension design, decisions 9 to 11).
  FocusStudyIntents:
    type: extensionkit-extension
    platform: iOS
    sources:
      - Intents
      - Shared
      - Integration
      - App/AuthorizationService.swift
      - App/FocusFilterHandler.swift
      - App/FocusServices.swift
      - App/FocusSettings.swift
      - App/FocusStudyFilter.swift
      - App/SelectionRepository.swift
      - App/SessionRecord.swift
      - App/TodaySnapshotWriter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy.intents
        INFOPLIST_FILE: Configuration/Intents-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Intents.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
  FocusActivity:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Activity/FocusActivityAttributes.swift
      - Activity/FocusActivityViews.swift
      - Shared/EverydayPlan.swift
      - Shared/FocusActivityContent.swift
      - Shared/TodaySnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy.activity
        INFOPLIST_FILE: Configuration/Activity-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Activity.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
  # The custom shield (2026-11-20 custom shield design): one static configuration, no App Group and no data read.
  FocusShield:
    type: app-extension
    platform: iOS
    sources:
      - Shield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy.shield
        INFOPLIST_FILE: Configuration/Shield-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Shield.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
  # The shield buttons (2026-11-21 shield name and open button design): only Family Controls, which Apple asks for every Screen Time extension; no App Group and no data read.
  FocusShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - ShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy.shieldaction
        INFOPLIST_FILE: Configuration/ShieldAction-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/ShieldAction.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
  FocusSDKTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      [
        SDKTests,
        Shared,
        Integration,
        App/SelectionRepository.swift,
        App/SelectionFeedback.swift,
        App/FocusActivityRuntime.swift,
        App/FocusSettings.swift,
        App/SessionRecord.swift,
        App/EverydaySettingsModel.swift,
        App/FocusModel.swift,
        App/FocusServices.swift,
        App/AuthorizationService.swift,
        App/FocusFilterHandler.swift,
        App/FocusRuntimeHolder.swift,
        App/StartupAttempts.swift,
        App/TodaySnapshotWriter.swift,
        App/EverydayPlanWriter.swift,
        App/PaidAccessStore.swift,
        App/WeeklyReviewModel.swift,
        App/CalendarShareCard.swift,
        App/CalendarShareRules.swift,
        App/FocusTheme.swift,
        Activity/FocusActivityAttributes.swift,
        Activity/SystemFocusActivityClient.swift,
        Shield,
        ShieldAction,
        App/Assets.xcassets,
        { path: Configuration/FocusStudy.storekit, buildPhase: resources },
      ]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy.sdktests
        GENERATE_INFOPLIST_FILE: YES
  FocusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FocusStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FocusStudy:
    build:
      targets:
        FocusStudy: all
    # A run from Xcode uses the local StoreKit test configuration; it never reaches App Store Connect.
    run:
      storeKitConfiguration: Configuration/FocusStudy.storekit
    test:
      targets: [FocusSDKTests, FocusUITests]
