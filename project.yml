name: FocusStudy
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 393JTTV68D
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FocusStudy:
    type: application
    platform: iOS
    sources: [App, Shared, Integration, Presentation]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy
        INFOPLIST_FILE: Configuration/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/App.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: FocusMonitor
        embed: true
      - target: FocusReport
        embed: true
  FocusMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared, Integration]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy.monitor
        INFOPLIST_FILE: Configuration/Monitor-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Monitor.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
  FocusReport:
    type: app-extension
    platform: iOS
    sources: [Report, Presentation]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy.report
        INFOPLIST_FILE: Configuration/Report-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Report.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
  FocusSDKTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      [
        SDKTests,
        Shared,
        Integration,
        App/SelectionRepository.swift,
        App/SelectionFeedback.swift,
        App/SessionRecord.swift,
        App/FocusModel.swift,
        App/AuthorizationService.swift,
      ]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy.sdktests
        GENERATE_INFOPLIST_FILE: YES
  FocusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FocusStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.donminzzi.focusStudy.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FocusStudy:
    build:
      targets:
        FocusStudy: all
    test:
      targets: [FocusSDKTests, FocusUITests]
