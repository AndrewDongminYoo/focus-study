name: Verify iOS MVP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Test control, SwiftData history and private report logic
        run: swift test
      - name: Verify two-process session race
        run: |
          xcrun swiftc Shared/ControlTypes.swift Shared/SharedControlStore.swift Shared/SessionControl.swift Tests/Fixtures/ControlRaceHelper.swift -o "$RUNNER_TEMP/focus-control-race"
          "$RUNNER_TEMP/focus-control-race" --verify
      - name: Select installed iOS 26.5 simulator
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          candidates = [d for runtime, entries in devices.items() if runtime.endswith(".iOS-26-5") for d in entries if d["name"].startswith("iPhone") and d.get("isAvailable", False)]
          if not candidates:
              raise SystemExit("Expected iOS 26.5 iPhone runtime is unavailable; inspect runner image support before changing this pin.")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("SIMULATOR_ID=" + candidates[0]["udid"] + "\n")
          PYTHON
      - name: Test SDK adapters and synthetic UI without signing
        run: >-
          xcodebuild test -project FocusStudy.xcodeproj -scheme FocusStudy
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/focus-derived"
          CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO
      - name: Build unsigned device Release
        run: >-
          xcodebuild build -project FocusStudy.xcodeproj -scheme FocusStudy
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/focus-release"
          CODE_SIGNING_ALLOWED=NO
