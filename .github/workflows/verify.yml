name: Verify iOS MVP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Test control, SwiftData history and private report logic
        run: swift test
      - name: Verify two-process session race
        run: |
          xcrun swiftc Shared/ControlTypes.swift Shared/SharedControlStore.swift Shared/SessionControl.swift Shared/DeferredStopMonitoring.swift Shared/FocusLength.swift Shared/BreakTiming.swift Shared/EverydaySchedule.swift Shared/EverydayPlan.swift Shared/TodaySnapshot.swift Shared/RegistrationMarker.swift Tests/Fixtures/ControlRaceHelper.swift -o "$RUNNER_TEMP/focus-control-race"
          "$RUNNER_TEMP/focus-control-race" --verify

  simulator:
    name: simulator (${{ matrix.suite }})
    runs-on: macos-26
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # The UI tests run in two jobs: on 2026-11-20 (run 44835178175) the build took about 4.5 min and the 82 UI tests 2112 s in sequence,
        # of which the 16 `testEveryday…` tests took 768 s; one job reached its 45 min limit on 2026-11-21 (#205).
        include:
          - suite: FocusSDKTests
            shard: sdk
            timeout: 20
          - suite: FocusUITests
            shard: ui
            # About 31 min of tests plus the build: on 2026-11-26 (run 45818436110) the 84 tests took 1882 s and the job 39.5 min,
            # and three more calendar share tests then reached the 40 min limit (run 45828873747), so 50 min.
            timeout: 50
          - suite: FocusUITests everyday
            shard: everyday
            # About 13 min of tests plus the build, so 30 min.
            timeout: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Select installed iOS 26.5 simulator
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          candidates = [d for runtime, entries in devices.items() if runtime.endswith(".iOS-26-5") for d in entries if d["name"].startswith("iPhone") and d.get("isAvailable", False)]
          if not candidates:
              raise SystemExit("Expected iOS 26.5 iPhone runtime is unavailable; inspect runner image support before changing this pin.")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("SIMULATOR_ID=" + candidates[0]["udid"] + "\n")
          PYTHON
      - name: Choose the tests of this job
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # The everyday job runs every `testEveryday…` method of FocusFlowTests, and the UI job skips the same list, so no test falls between them.
          everyday=()
          while IFS= read -r name; do everyday+=("$name"); done < <(grep -oE 'func testEveryday[A-Za-z0-9_]*' UITests/FocusFlowTests.swift | cut -d' ' -f2)
          if [ "${#everyday[@]}" -eq 0 ]; then
            echo "No testEveryday methods found in UITests/FocusFlowTests.swift; update this step before splitting the UI tests." >&2
            exit 1
          fi
          case "$SHARD" in
            sdk) args="-only-testing:FocusSDKTests" ;;
            ui)
              args="-only-testing:FocusUITests"
              for name in "${everyday[@]}"; do args+=" -skip-testing:FocusUITests/FocusFlowTests/$name"; done
              ;;
            everyday)
              args=""
              for name in "${everyday[@]}"; do args+=" -only-testing:FocusUITests/FocusFlowTests/$name"; done
              ;;
            *) echo "Unknown shard $SHARD" >&2; exit 1 ;;
          esac
          echo "Running ${#everyday[@]} everyday tests in the everyday job and skipping them in the UI job."
          echo "TEST_SELECTION=$args" >> "$GITHUB_ENV"
      - name: Test ${{ matrix.suite }} without signing
        run: >-
          xcodebuild test -project FocusStudy.xcodeproj -scheme FocusStudy
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          $TEST_SELECTION
          -derivedDataPath "$RUNNER_TEMP/focus-derived"
          -resultBundlePath "$RUNNER_TEMP/focus-tests.xcresult"
          CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO
      - name: Export synthetic UI attachments
        if: ${{ !cancelled() && matrix.shard != 'sdk' }}
        run: |
          if [ -d "$RUNNER_TEMP/focus-tests.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/focus-tests.xcresult" \
              --output-path "$RUNNER_TEMP/focus-test-attachments"
          fi
      - name: Preserve synthetic UI attachments
        if: ${{ !cancelled() && matrix.shard != 'sdk' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: focus-test-attachments-${{ matrix.shard }}
          path: ${{ runner.temp }}/focus-test-attachments
          retention-days: 3

  release:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build unsigned device Release
        run: >-
          xcodebuild build -project FocusStudy.xcodeproj -scheme FocusStudy
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/focus-release"
          CODE_SIGNING_ALLOWED=NO
